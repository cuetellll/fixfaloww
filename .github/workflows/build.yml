name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach binaries to GitHub Releases

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    name: Build Windows Executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: pip install -r requirements-dev.txt
      - name: Build standalone executable
        run: python scripts/build.py
      - name: Compute SHA-256 checksum
        run: |
          Get-FileHash -Algorithm SHA256 dist/VidShrink.exe | Out-File -Encoding utf8 dist/VidShrink.exe.sha256
        shell: powershell
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VidShrink-windows
          path: |
            dist/VidShrink.exe
            dist/VidShrink.exe.sha256
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VidShrink.exe
            dist/VidShrink.exe.sha256
          generate_release_notes: true
